<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аренда жилья — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <h1>🏠 Аренда жилья</h1>
            <span class="stat-badge" id="totalBadge">…</span>
        </div>
    </header>

    <main class="container">

        <!-- Chart -->
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

        <!-- Filters -->
        <section class="filter-panel">
            <div class="filter-row">
                <select class="filter-select" id="citySelect">
                    <option value="">Все города</option>
                </select>
            </div>
            <div class="filter-row">
                <input class="filter-input" type="number" id="minPrice" placeholder="от, $" min="0">
                <input class="filter-input" type="number" id="maxPrice" placeholder="до, $" min="0">
            </div>
            <div class="filter-row">
                <button class="btn-apply" id="applyBtn">Применить</button>
            </div>
        </section>

        <!-- Search -->
        <div class="search-wrap">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по ключевым словам...">
        </div>

        <!-- Listings -->
        <section class="listings" id="listings"></section>

        <!-- Load more -->
        <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
            <button class="btn-load-more" id="loadMoreBtn">Загрузить ещё</button>
        </div>
    </main>

    <!-- FABs -->
    <div class="fab" id="suggestFab" title="Предложить канал/город">➕</div>
    <div class="fab admin-fab" id="adminFab" title="Админ панель">⚙️</div>

    <!-- Suggest Modal -->
    <div class="modal-overlay" id="suggestModal">
        <div class="modal">
            <button class="btn-close" onclick="closeModal('suggestModal')">×</button>
            <h2 id="modalTitle">Предложить</h2>
            <div class="form-group">
                <label class="form-label">Я хочу:</label>
                <select class="form-control" id="suggType" onchange="toggleSuggestFields()">
                    <option value="listing">Разместить объявление</option>
                    <option value="source">Предложить источник</option>
                </select>
            </div>

            <div id="listingFields">
                <div class="form-group">
                    <label class="form-label">Город</label>
                    <select class="form-control" id="suggCity">
                        <!-- Populated via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Цена (USD)</label>
                    <input type="number" class="form-control" id="suggPrice" placeholder="500">
                </div>
                <div class="form-group">
                    <label class="form-label">Описание объявления</label>
                    <textarea class="form-control" id="suggContentListing"
                        placeholder="Сдам квартиру, 2 комнаты..."></textarea>
                </div>
            </div>

            <div id="sourceFields" style="display:none">
                <div class="form-group">
                    <label class="form-label">@канал - город</label>
                    <input type="text" class="form-control" id="suggContentSource" placeholder="@channelname - Batumi">
                </div>
            </div>

            <button class="btn-apply" id="sendSuggBtn">Отправить</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2>Admin Dashboard</h2>
            <button class="btn-close" style="position:static" onclick="closeAdmin()">Закрыть</button>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn-apply" style="padding:8px; font-size:12px;" onclick="loadAdminDashboard()">Обновить
                данные</button>
            <button class="btn-apply" id="runParserBtn"
                style="padding:8px; font-size:12px; background:linear-gradient(135deg, #2ecc71, #27ae60); box-shadow:0 4px 15px rgba(46, 204, 113, 0.3);">Обновить
                базу</button>
        </div>

        <div class="stat-grid" id="adminStats">
            <!-- Populated via JS -->
        </div>

        <h3 class="section-title">Предложения</h3>
        <div id="adminSuggestions"></div>

        <h3 class="section-title" style="margin-top:20px">Каналы</h3>
        <div id="adminChannels"></div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
